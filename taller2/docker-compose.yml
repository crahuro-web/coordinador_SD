services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_sd
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123

  coordinador:
    build: ./coordinador
    container_name: coordinador_sd
    restart: unless-stopped
    network_mode: host
    depends_on:
      - rabbitmq
    environment:
      RABBIT_HOST: "100.78.187.12"
      RABBIT_USER: "admin"
      RABBIT_PASS: "admin123"

  agente:
    build: ./agente
    container_name: agente_sd
    restart: unless-stopped
    network_mode: host
    depends_on:
      - coordinador
      - rabbitmq
    environment:
      NODO_ID: "2"
      COORD_URL: "http://100.78.187.12:8000"
      RABBIT_HOST: "100.78.187.12"
      RABBIT_USER: "admin"
      RABBIT_PASS: "admin123"
      AUTO_SAGA: "true"
